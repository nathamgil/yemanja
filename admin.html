<main id="tela-login" class="login">

    <h1>Painel do Yemanjá</h1>

    <button class="bt bt-cheio bt-largo" type="submit" style="margin-top:18px">Entrar</button>
    <div id="login-erro" aria-live="polite"></div>
    <p style="margin-top:16px;font-size:16px"><a href="index.html">Voltar para o site</a></p>
  </form>
</main>

<div id="tela-painel" hidden>

    <button role="tab" data-aba="cardapio" aria-selected="false">Cardápio</button>

</div>
